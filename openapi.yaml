openapi: 3.0.3

info:
  title: Book Information System API
  description: API สำหรับจัดการข้อมูลหนังสือ ผู้แต่ง และหมวดหมู่ ใน Phase 3
  version: 3.0.0

servers:
  - url: http://localhost:3000
    description: Local Book API server

tags:
  - name: Books
    description: จัดการข้อมูลหนังสือ
  - name: Authors
    description: จัดการข้อมูลผู้แต่ง
  - name: Categories
    description: จัดการหมวดหมู่หนังสือ

paths:
  /api/books:
    get:
      tags:
        - Books
      summary: ดึงรายการหนังสือ
      description: สามารถค้นหาหนังสือด้วย query parameter q
      parameters:
        - name: q
          in: query
          required: false
          description: คำค้นหาหนังสือ
          schema:
            type: string
      responses:
        '200':
          description: ดึงรายการหนังสือสำเร็จ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookSummaryListResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags:
        - Books
      summary: เพิ่มหนังสือ
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookInput'
      responses:
        '201':
          description: เพิ่มหนังสือสำเร็จ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookDetailResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/books/{id}:
    parameters:
      - $ref: '#/components/parameters/BookId'

    get:
      tags:
        - Books
      summary: ดึงรายละเอียดหนังสือ
      responses:
        '200':
          description: ดึงรายละเอียดหนังสือสำเร็จ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookDetailResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    put:
      tags:
        - Books
      summary: แก้ไขข้อมูลหนังสือ
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookInput'
      responses:
        '200':
          description: แก้ไขข้อมูลหนังสือสำเร็จ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookDetailResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags:
        - Books
      summary: ลบหนังสือ
      responses:
        '200':
          description: ลบหนังสือสำเร็จ
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    required:
                      - deleted_book_id
                    properties:
                      deleted_book_id:
                        type: integer
                        example: 12
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/books/{id}/external-info:
    parameters:
      - $ref: '#/components/parameters/BookId'

    get:
      tags:
        - Books
      summary: ดึงข้อมูลหนังสือจากแหล่งข้อมูลภายนอก
      description: ดึงรายละเอียดหนังสือพร้อมข้อมูลผลการค้นหาจากบริการภายนอก
      responses:
        '200':
          description: ดึงข้อมูลสำเร็จ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalInfoResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/authors:
    get:
      tags:
        - Authors
      summary: ดึงรายการผู้แต่ง
      responses:
        '200':
          description: ดึงรายการผู้แต่งสำเร็จ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorListResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags:
        - Authors
      summary: เพิ่มผู้แต่ง
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorInput'
      responses:
        '201':
          description: เพิ่มผู้แต่งสำเร็จ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/authors/{id}/books:
    parameters:
      - name: id
        in: path
        required: true
        description: รหัสผู้แต่ง
        schema:
          type: integer

    get:
      tags:
        - Authors
      summary: ดึงหนังสือทั้งหมดของผู้แต่ง
      responses:
        '200':
          description: ดึงหนังสือของผู้แต่งสำเร็จ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorBooksResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/categories:
    get:
      tags:
        - Categories
      summary: ดึงรายการหมวดหมู่หนังสือ
      responses:
        '200':
          description: ดึงรายการหมวดหมู่สำเร็จ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryListResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags:
        - Categories
      summary: เพิ่มหมวดหมู่หนังสือ
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryInput'
      responses:
        '201':
          description: เพิ่มหมวดหมู่สำเร็จ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  parameters:
    BookId:
      name: id
      in: path
      required: true
      description: รหัสหนังสือ
      schema:
        type: integer

  responses:
    BadRequest:
      description: ข้อมูลที่ส่งมาไม่ถูกต้อง หรือมีการอ้างอิงข้อมูลที่ไม่มีอยู่
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    NotFound:
      description: ไม่พบข้อมูลที่ต้องการ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Conflict:
      description: ข้อมูลซ้ำหรือเกิดข้อขัดแย้งกับข้อกำหนดของฐานข้อมูล
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    InternalServerError:
      description: เกิดข้อผิดพลาดภายในเซิร์ฟเวอร์
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    BookInput:
      type: object
      required:
        - title
        - isbn
        - author_id
      properties:
        title:
          type: string
          example: Clean Code
        isbn:
          type: string
          example: '9780132350884'
        author_id:
          type: integer
          example: 1
        published_year:
          type: integer
          nullable: true
          example: 2008
        price:
          type: number
          minimum: 0
          example: 850
        category_ids:
          type: array
          description: รายการรหัสหมวดหมู่หนังสือ
          items:
            type: integer
          example:
            - 1
            - 2

    BookSummary:
      type: object
      required:
        - book_id
        - title
        - isbn
        - published_year
        - price
        - total_copies
        - available_copies
        - author_id
        - author_name
      properties:
        book_id:
          type: integer
          example: 1
        title:
          type: string
          example: Clean Code
        isbn:
          type: string
          example: '9780132350884'
        published_year:
          type: integer
          nullable: true
          example: 2008
        price:
          type: string
          description: ค่า DECIMAL จากฐานข้อมูล MySQL อาจถูกส่งกลับเป็น string
          example: '850.00'
        total_copies:
          type: integer
          example: 5
        available_copies:
          type: integer
          example: 3
        author_id:
          type: integer
          example: 1
        author_name:
          type: string
          example: Robert C. Martin

    BookDetail:
      allOf:
        - $ref: '#/components/schemas/BookSummary'
        - type: object
          properties:
            nationality:
              type: string
              nullable: true
              example: American
            categories:
              type: array
              items:
                $ref: '#/components/schemas/Category'
              example:
                - category_id: 1
                  name: Programming

    Category:
      type: object
      required:
        - category_id
        - name
      properties:
        category_id:
          type: integer
          example: 1
        name:
          type: string
          example: Programming

    Author:
      type: object
      required:
        - author_id
        - name
      properties:
        author_id:
          type: integer
          example: 1
        name:
          type: string
          example: Robert C. Martin
        nationality:
          type: string
          nullable: true
          example: American
        birth_year:
          type: integer
          nullable: true
          example: 1952

    AuthorInput:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          example: Robert C. Martin
        nationality:
          type: string
          nullable: true
          example: American
        birth_year:
          type: integer
          nullable: true
          example: 1952

    AuthorBook:
      type: object
      required:
        - book_id
        - title
        - isbn
        - published_year
        - price
      properties:
        book_id:
          type: integer
          example: 1
        title:
          type: string
          example: Clean Code
        isbn:
          type: string
          example: '9780132350884'
        published_year:
          type: integer
          nullable: true
          example: 2008
        price:
          type: string
          description: ค่า DECIMAL จากฐานข้อมูล MySQL อาจถูกส่งกลับเป็น string
          example: '850.00'

    BookSummaryListResponse:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/BookSummary'

    BookDetailResponse:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/BookDetail'

    AuthorListResponse:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/Author'

    AuthorResponse:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/Author'

    AuthorBooksResponse:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          required:
            - author
            - books
          properties:
            author:
              type: object
              required:
                - author_id
                - name
              properties:
                author_id:
                  type: integer
                  example: 1
                name:
                  type: string
                  example: Robert C. Martin
            books:
              type: array
              items:
                $ref: '#/components/schemas/AuthorBook'

    CategoryListResponse:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/Category'

    CategoryInput:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          example: Programming

    CategoryResponse:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/Category'

    ExternalInfoResponse:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            book:
              $ref: '#/components/schemas/BookDetail'
            source:
              type: string
              nullable: true
              example: open-library
            found:
              type: boolean
              nullable: true
              example: true
            attempts:
              type: integer
              nullable: true
              example: 1
            external:
              type: object
              nullable: true
              additionalProperties: true
            message:
              type: string
              nullable: true
            fallback_reason:
              type: string
              nullable: true

    ErrorResponse:
      type: object
      required:
        - success
        - message
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: ไม่พบข้อมูลที่ต้องการ