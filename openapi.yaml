openapi: 3.0.3

info:
  title: Book Information System API
  description: API สำหรับจัดการข้อมูลหนังสือ ผู้แต่ง และหมวดหมู่ ใน Phase 3
  version: 3.0.0

servers:
  - url: http://localhost:3000
    description: Local Book API server
  - url: http://localhost:3001
    description: Local Circulation Service server

tags:
  - name: Books
    description: จัดการข้อมูลหนังสือ
  - name: Authors
    description: จัดการข้อมูลผู้แต่ง
  - name: Categories
    description: จัดการหมวดหมู่หนังสือ
  - name: Members
    description: จัดการข้อมูลสมาชิก
  - name: Loans
    description: จัดการการยืมและคืนหนังสือ
  - name: Health
    description: ตรวจสอบสถานะบริการ

paths:
  /api/books:
    get:
      tags:
        - Books
      summary: ดึงรายการหนังสือ
      description: สามารถค้นหาหนังสือด้วย query parameter q
      parameters:
        - name: q
          in: query
          required: false
          description: คำค้นหาหนังสือ
          schema:
            type: string
      responses:
        '200':
          description: ดึงรายการหนังสือสำเร็จ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookSummaryListResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags:
        - Books
      summary: เพิ่มหนังสือ
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookInput'
      responses:
        '201':
          description: เพิ่มหนังสือสำเร็จ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookDetailResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/books/{id}:
    parameters:
      - $ref: '#/components/parameters/BookId'

    get:
      tags:
        - Books
      summary: ดึงรายละเอียดหนังสือ
      responses:
        '200':
          description: ดึงรายละเอียดหนังสือสำเร็จ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookDetailResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    put:
      tags:
        - Books
      summary: แก้ไขข้อมูลหนังสือ
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookInput'
      responses:
        '200':
          description: แก้ไขข้อมูลหนังสือสำเร็จ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookDetailResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags:
        - Books
      summary: ลบหนังสือ
      responses:
        '200':
          description: ลบหนังสือสำเร็จ
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    required:
                      - deleted_book_id
                    properties:
                      deleted_book_id:
                        type: integer
                        example: 12
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/books/{id}/external-info:
    parameters:
      - $ref: '#/components/parameters/BookId'

    get:
      tags:
        - Books
      summary: ดึงข้อมูลหนังสือจากแหล่งข้อมูลภายนอก
      description: ดึงรายละเอียดหนังสือพร้อมข้อมูลผลการค้นหาจากบริการภายนอก
      responses:
        '200':
          description: ดึงข้อมูลสำเร็จ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalInfoResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/authors:
    get:
      tags:
        - Authors
      summary: ดึงรายการผู้แต่ง
      responses:
        '200':
          description: ดึงรายการผู้แต่งสำเร็จ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorListResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags:
        - Authors
      summary: เพิ่มผู้แต่ง
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorInput'
      responses:
        '201':
          description: เพิ่มผู้แต่งสำเร็จ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/authors/{id}/books:
    parameters:
      - name: id
        in: path
        required: true
        description: รหัสผู้แต่ง
        schema:
          type: integer

    get:
      tags:
        - Authors
      summary: ดึงหนังสือทั้งหมดของผู้แต่ง
      responses:
        '200':
          description: ดึงหนังสือของผู้แต่งสำเร็จ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorBooksResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/categories:
    get:
      tags:
        - Categories
      summary: ดึงรายการหมวดหมู่หนังสือ
      responses:
        '200':
          description: ดึงรายการหมวดหมู่สำเร็จ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryListResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags:
        - Categories
      summary: เพิ่มหมวดหมู่หนังสือ
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryInput'
      responses:
        '201':
          description: เพิ่มหมวดหมู่สำเร็จ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /health:
    get:
      tags:
        - Health
      summary: ตรวจสอบสถานะ Circulation Service
      servers:
        - url: http://localhost:3001
      responses:
        '200':
          description: บริการทำงานปกติ
          content:
            application/json:
              schema:
                type: object
                required: [service, status]
                properties:
                  service:
                    type: string
                    example: circulation-service
                  status:
                    type: string
                    example: ok

  /api/members:
    servers:
      - url: http://localhost:3001
    get:
      tags:
        - Members
      summary: ดึงรายชื่อสมาชิก
      responses:
        '200':
          description: ดึงรายชื่อสมาชิกสำเร็จ
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Member'
        '500':
          description: ไม่สามารถดึงข้อมูลสมาชิกได้
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CirculationError'
    post:
      tags:
        - Members
      summary: เพิ่มสมาชิก
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberInput'
      responses:
        '201':
          description: เพิ่มสมาชิกสำเร็จ
          content:
            application/json:
              schema:
                type: object
                required: [message, member_id]
                properties:
                  message:
                    type: string
                    example: เพิ่มสมาชิกสำเร็จ
                  member_id:
                    type: integer
                    example: 1
        '400':
          $ref: '#/components/responses/CirculationBadRequest'
        '409':
          description: อีเมลนี้มีผู้ใช้งานแล้ว
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CirculationError'
        '500':
          description: ไม่สามารถเพิ่มสมาชิกได้
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CirculationError'

  /api/members/{id}:
    servers:
      - url: http://localhost:3001
    parameters:
      - name: id
        in: path
        required: true
        description: รหัสสมาชิก
        schema:
          type: integer
    put:
      tags:
        - Members
      summary: แก้ไขข้อมูลสมาชิก
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberInput'
      responses:
        '200':
          description: แก้ไขข้อมูลสมาชิกสำเร็จ
          content:
            application/json:
              schema:
                type: object
                required: [message, data]
                properties:
                  message:
                    type: string
                    example: แก้ไขข้อมูลสมาชิกสำเร็จ
                  data:
                    $ref: '#/components/schemas/Member'
        '400':
          $ref: '#/components/responses/CirculationBadRequest'
        '404':
          $ref: '#/components/responses/CirculationNotFound'
        '409':
          description: อีเมลนี้มีผู้ใช้งานแล้ว
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CirculationError'
        '500':
          description: ไม่สามารถแก้ไขข้อมูลสมาชิกได้
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CirculationError'
    delete:
      tags:
        - Members
      summary: ลบสมาชิก
      responses:
        '200':
          description: ลบสมาชิกสำเร็จ
          content:
            application/json:
              schema:
                type: object
                required: [message, member_id]
                properties:
                  message:
                    type: string
                    example: ลบสมาชิกสำเร็จ
                  member_id:
                    type: integer
                    example: 1
        '400':
          $ref: '#/components/responses/CirculationBadRequest'
        '404':
          $ref: '#/components/responses/CirculationNotFound'
        '409':
          description: ไม่สามารถลบสมาชิกที่มีประวัติการยืมได้
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CirculationError'
        '500':
          description: ไม่สามารถลบสมาชิกได้
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CirculationError'

  /api/members/{id}/loans:
    servers:
      - url: http://localhost:3001
    parameters:
      - name: id
        in: path
        required: true
        description: รหัสสมาชิก
        schema:
          type: integer
    get:
      tags:
        - Loans
      summary: ดูประวัติการยืมของสมาชิก
      responses:
        '200':
          description: ดึงประวัติการยืมสำเร็จ
          content:
            application/json:
              schema:
                type: object
                required: [member, data]
                properties:
                  member:
                    type: object
                    required: [member_id, name]
                    properties:
                      member_id:
                        type: integer
                      name:
                        type: string
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/MemberLoan'
        '400':
          $ref: '#/components/responses/CirculationBadRequest'
        '404':
          $ref: '#/components/responses/CirculationNotFound'
        '500':
          description: ไม่สามารถดึงประวัติการยืมได้
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CirculationError'

  /api/loans/overdue:
    servers:
      - url: http://localhost:3001
    get:
      tags:
        - Loans
      summary: ดูรายการยืมเกินกำหนดที่ยังไม่ได้คืน
      responses:
        '200':
          description: ดึงรายการยืมเกินกำหนดสำเร็จ
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/OverdueLoan'
        '500':
          description: ไม่สามารถดึงรายการยืมเกินกำหนดได้
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CirculationError'

  /api/loans:
    servers:
      - url: http://localhost:3001
    post:
      tags:
        - Loans
      summary: ยืมหนังสือ
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoanInput'
      responses:
        '201':
          description: ยืมหนังสือสำเร็จ
          content:
            application/json:
              schema:
                type: object
                required: [message, loan_id, book_id, member_id, loan_date, due_date]
                properties:
                  message:
                    type: string
                    example: ยืมหนังสือสำเร็จ
                  loan_id:
                    type: integer
                  book_id:
                    type: integer
                  member_id:
                    type: integer
                  loan_date:
                    type: string
                    format: date
                  due_date:
                    type: string
                    format: date
        '400':
          description: ข้อมูลการยืมหรือวันที่ไม่ถูกต้อง
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CirculationError'
        '404':
          description: ไม่พบสมาชิกหรือหนังสือ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CirculationError'
        '409':
          description: หนังสือหมด ไม่มีเล่มให้ยืม
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CirculationError'
        '500':
          description: ไม่สามารถทำรายการยืมหนังสือได้
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CirculationError'

  /api/loans/{id}/return:
    servers:
      - url: http://localhost:3001
    parameters:
      - name: id
        in: path
        required: true
        description: รหัสรายการยืม
        schema:
          type: integer
    put:
      tags:
        - Loans
      summary: คืนหนังสือ
      responses:
        '200':
          description: คืนหนังสือสำเร็จ
          content:
            application/json:
              schema:
                type: object
                required: [message, loan_id]
                properties:
                  message:
                    type: string
                    example: คืนหนังสือสำเร็จ
                  loan_id:
                    type: integer
        '400':
          $ref: '#/components/responses/CirculationBadRequest'
        '404':
          $ref: '#/components/responses/CirculationNotFound'
        '409':
          description: หนังสือรายการนี้ถูกคืนแล้ว
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CirculationError'
        '500':
          description: ไม่สามารถคืนหนังสือได้
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CirculationError'

components:
  parameters:
    BookId:
      name: id
      in: path
      required: true
      description: รหัสหนังสือ
      schema:
        type: integer

  responses:
    CirculationBadRequest:
      description: ข้อมูลที่ส่งมาไม่ถูกต้อง
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CirculationError'
    CirculationNotFound:
      description: ไม่พบข้อมูลที่ต้องการ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CirculationError'
    BadRequest:
      description: ข้อมูลที่ส่งมาไม่ถูกต้อง หรือมีการอ้างอิงข้อมูลที่ไม่มีอยู่
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    NotFound:
      description: ไม่พบข้อมูลที่ต้องการ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Conflict:
      description: ข้อมูลซ้ำหรือเกิดข้อขัดแย้งกับข้อกำหนดของฐานข้อมูล
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    InternalServerError:
      description: เกิดข้อผิดพลาดภายในเซิร์ฟเวอร์
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    BookInput:
      type: object
      required:
        - title
        - isbn
        - author_id
      properties:
        title:
          type: string
          example: Clean Code
        isbn:
          type: string
          example: '9780132350884'
        author_id:
          type: integer
          example: 1
        published_year:
          type: integer
          nullable: true
          example: 2008
        price:
          type: number
          minimum: 0
          example: 850
        category_ids:
          type: array
          description: รายการรหัสหมวดหมู่หนังสือ
          items:
            type: integer
          example:
            - 1
            - 2

    BookSummary:
      type: object
      required:
        - book_id
        - title
        - isbn
        - published_year
        - price
        - total_copies
        - available_copies
        - author_id
        - author_name
      properties:
        book_id:
          type: integer
          example: 1
        title:
          type: string
          example: Clean Code
        isbn:
          type: string
          example: '9780132350884'
        published_year:
          type: integer
          nullable: true
          example: 2008
        price:
          type: string
          description: ค่า DECIMAL จากฐานข้อมูล MySQL อาจถูกส่งกลับเป็น string
          example: '850.00'
        total_copies:
          type: integer
          example: 5
        available_copies:
          type: integer
          example: 3
        author_id:
          type: integer
          example: 1
        author_name:
          type: string
          example: Robert C. Martin

    BookDetail:
      allOf:
        - $ref: '#/components/schemas/BookSummary'
        - type: object
          properties:
            nationality:
              type: string
              nullable: true
              example: American
            categories:
              type: array
              items:
                $ref: '#/components/schemas/Category'
              example:
                - category_id: 1
                  name: Programming

    Category:
      type: object
      required:
        - category_id
        - name
      properties:
        category_id:
          type: integer
          example: 1
        name:
          type: string
          example: Programming

    Author:
      type: object
      required:
        - author_id
        - name
      properties:
        author_id:
          type: integer
          example: 1
        name:
          type: string
          example: Robert C. Martin
        nationality:
          type: string
          nullable: true
          example: American
        birth_year:
          type: integer
          nullable: true
          example: 1952

    AuthorInput:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          example: Robert C. Martin
        nationality:
          type: string
          nullable: true
          example: American
        birth_year:
          type: integer
          nullable: true
          example: 1952

    AuthorBook:
      type: object
      required:
        - book_id
        - title
        - isbn
        - published_year
        - price
      properties:
        book_id:
          type: integer
          example: 1
        title:
          type: string
          example: Clean Code
        isbn:
          type: string
          example: '9780132350884'
        published_year:
          type: integer
          nullable: true
          example: 2008
        price:
          type: string
          description: ค่า DECIMAL จากฐานข้อมูล MySQL อาจถูกส่งกลับเป็น string
          example: '850.00'

    BookSummaryListResponse:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/BookSummary'

    BookDetailResponse:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/BookDetail'

    AuthorListResponse:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
